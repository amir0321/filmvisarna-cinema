<!doctype html>
<html lang="sv" data-theme="dark" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var theme = 'dark';
      try {
        if (localStorage.getItem('fv-theme') === 'light') theme = 'light';
      } catch (_) { /* Storage may be disabled. */ }
      var locale = 'sv';
      try {
        if (localStorage.getItem('fv-locale') === 'en') locale = 'en';
      } catch (_) { /* Storage may be disabled. */ }
      var root = document.documentElement;
      root.lang = locale;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-bs-theme', theme);
      root.style.colorScheme = theme;
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Filmvisarna</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
