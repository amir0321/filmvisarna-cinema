$kind: http-request
name: Cancel booking by reference and email (Guest)
url: http://localhost:3000/api/bookings/cancel-by-token
method: POST
headers:
  X-CSRF-Protection: "1"
body:
  type: json
  content: |
    {
      "bookingRef": "{{booking_reference}}",
      "email": "{{booking_email}}"
    }
order: 6000
